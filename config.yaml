# 全局配置

# 唤醒词配置（OpenWakeWord，开箱即用，无需注册）
wake_word:
  model_name: "default"  # "default" 使用内置唤醒词，或指定 .onnx 模型文件路径
  threshold: 0.5          # 检测阈值 (0-1)，越高越严格

# 模型路径
model_paths:
  vosk: "models/vosk/vosk-model-small-cn-0.22"

# 音频配置
audio:
  device_index: -1  # -1 = 默认麦克风
  sample_rate: 16000
  frame_length: 512

# 录音配置
recording:
  silence_threshold: 500  # RMS 静音阈值
  silence_duration: 1.5  # 连续静音多少秒视为结束
  max_duration: 8.0  # 最大录音时长秒

# TTS 配置 (pyttsx3，Windows 原生，不需要模型)
tts:
  enabled: true

# 音量控制
volume:
  step: 10  # 每次调整步长
